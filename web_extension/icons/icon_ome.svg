<svg width="128" height="128" viewBox="-2 10 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="rBodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="rgba(147,112,219,0.5)"/>
            <stop offset="50%" stop-color="rgba(80,100,200,0.4)"/>
            <stop offset="100%" stop-color="rgba(66,133,244,0.35)"/>
        </linearGradient>
        <linearGradient id="rGoggleGrad" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="rgba(186,147,255,0.6)"/>
            <stop offset="100%" stop-color="rgba(147,112,219,0.5)"/>
        </linearGradient>
        <radialGradient id="rGlowEye" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00ffff"/>
            <stop offset="100%" stop-color="#00e5ff"/>
        </radialGradient>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(40,35,60,0.95)"/>
            <stop offset="100%" stop-color="rgba(25,22,40,0.98)"/>
        </radialGradient>
    </defs>
    <!-- Background circle - tighter fit -->
    <circle cx="30" cy="42" r="30" fill="url(#bgGrad)"/>
    <!-- Side ears/handles -->
    <ellipse cx="4" cy="46" rx="5" ry="7" fill="rgba(66,133,244,0.35)" stroke="rgba(66,133,244,0.6)" stroke-width="1.5"/>
    <ellipse cx="56" cy="46" rx="5" ry="7" fill="rgba(66,133,244,0.35)" stroke="rgba(66,133,244,0.6)" stroke-width="1.5"/>
    <!-- Main body/head -->
    <path d="M6 50 Q6 24 30 20 Q54 24 54 50 Q54 56 30 58 Q6 56 6 50 Z" fill="url(#rBodyGrad)" stroke="rgba(66,133,244,0.6)" stroke-width="1.5"/>
    <!-- Goggles -->
    <ellipse cx="19" cy="26" rx="10" ry="8" fill="url(#rGoggleGrad)" stroke="rgba(147,112,219,0.8)" stroke-width="1.5"/>
    <ellipse cx="41" cy="26" rx="10" ry="8" fill="url(#rGoggleGrad)" stroke="rgba(147,112,219,0.8)" stroke-width="1.5"/>
    <!-- Goggle inner dark -->
    <ellipse cx="19" cy="26" rx="7" ry="6" fill="rgba(40,40,80,0.7)"/>
    <ellipse cx="41" cy="26" rx="7" ry="6" fill="rgba(40,40,80,0.7)"/>
    <!-- Goggle bridge -->
    <rect x="28" y="24" width="4" height="4" rx="1" fill="rgba(147,112,219,0.6)"/>
    <!-- Mouth/visor area -->
    <rect x="12" y="38" rx="6" ry="6" width="36" height="17" fill="rgba(30,50,90,0.5)" stroke="rgba(66,133,244,0.5)" stroke-width="1"/>
    <!-- Glowing eyes in visor -->
    <ellipse cx="22" cy="46" rx="4" ry="6" fill="url(#rGlowEye)"/>
    <ellipse cx="38" cy="46" rx="4" ry="6" fill="url(#rGlowEye)"/>
    <!-- Eye glow rings -->
    <ellipse cx="22" cy="46" rx="5" ry="7" fill="none" stroke="rgba(0,229,255,0.3)" stroke-width="2"/>
    <ellipse cx="38" cy="46" rx="5" ry="7" fill="none" stroke="rgba(0,229,255,0.3)" stroke-width="2"/>
</svg>
