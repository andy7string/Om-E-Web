<svg width="128" height="128" viewBox="-2 -2 64 76" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="kFluffy" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="70%" stop-color="#f8f4ff"/>
            <stop offset="100%" stop-color="#e8e0f0"/>
        </radialGradient>
        <linearGradient id="kPinkEar" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffb6c1"/>
            <stop offset="100%" stop-color="#ff91a4"/>
        </linearGradient>
        <radialGradient id="kEyeBlue" cx="50%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#7ec8e3"/>
            <stop offset="50%" stop-color="#4a9eca"/>
            <stop offset="100%" stop-color="#2d7eb0"/>
        </radialGradient>
        <radialGradient id="kCherry" cx="30%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#ff8a9b"/>
            <stop offset="100%" stop-color="#e05670"/>
        </radialGradient>
        <radialGradient id="kBgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(40,35,60,0.95)"/>
            <stop offset="100%" stop-color="rgba(25,22,40,0.98)"/>
        </radialGradient>
    </defs>
    <!-- Background circle - tighter fit -->
    <circle cx="30" cy="38" r="34" fill="url(#kBgGrad)"/>
    <!-- Ears -->
    <path d="M12 28 L8 8 L22 22 Z" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="1"/>
    <path d="M13 24 L11 12 L19 21 Z" fill="url(#kPinkEar)"/>
    <path d="M48 28 L52 8 L38 22 Z" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="1"/>
    <path d="M47 24 L49 12 L41 21 Z" fill="url(#kPinkEar)"/>
    <!-- Cherry stem and fruit -->
    <path d="M30 2 Q28 -2 26 0 M30 2 Q32 -2 34 0" stroke="#50a060" stroke-width="1.5" fill="none"/>
    <ellipse cx="30" cy="10" rx="8" ry="7" fill="url(#kCherry)"/>
    <ellipse cx="27" cy="7" rx="2" ry="1.2" fill="rgba(255,255,255,0.5)"/>
    <ellipse cx="26" cy="11" rx="0.8" ry="0.5" fill="rgba(255,220,180,0.7)"/>
    <ellipse cx="34" cy="10" rx="0.8" ry="0.5" fill="rgba(255,220,180,0.7)"/>
    <!-- Main body -->
    <ellipse cx="30" cy="38" rx="26" ry="24" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="1"/>
    <!-- Side fluff -->
    <ellipse cx="6" cy="40" rx="6" ry="8" fill="url(#kFluffy)"/>
    <ellipse cx="54" cy="40" rx="6" ry="8" fill="url(#kFluffy)"/>
    <!-- Eyes -->
    <ellipse cx="19" cy="38" rx="8" ry="9" fill="url(#kEyeBlue)" stroke="#2d6090" stroke-width="0.5"/>
    <ellipse cx="41" cy="38" rx="8" ry="9" fill="url(#kEyeBlue)" stroke="#2d6090" stroke-width="0.5"/>
    <!-- Eye highlights -->
    <circle cx="16" cy="35" r="3" fill="white"/>
    <circle cx="21" cy="33" r="1.5" fill="white"/>
    <circle cx="38" cy="35" r="3" fill="white"/>
    <circle cx="43" cy="33" r="1.5" fill="white"/>
    <!-- Pupils -->
    <ellipse cx="20" cy="40" rx="2.5" ry="3" fill="#1a3050"/>
    <ellipse cx="42" cy="40" rx="2.5" ry="3" fill="#1a3050"/>
    <!-- Blush -->
    <ellipse cx="9" cy="44" rx="4" ry="2.5" fill="rgba(255,150,170,0.5)"/>
    <ellipse cx="51" cy="44" rx="4" ry="2.5" fill="rgba(255,150,170,0.5)"/>
    <!-- Nose and mouth -->
    <ellipse cx="30" cy="46" rx="2" ry="1.5" fill="#ffb0c0"/>
    <path d="M26 50 Q30 54 34 50" stroke="#c090a0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Body/feet -->
    <ellipse cx="30" cy="64" rx="14" ry="8" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="1"/>
    <ellipse cx="22" cy="68" rx="4" ry="3" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="0.5"/>
    <ellipse cx="38" cy="68" rx="4" ry="3" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="0.5"/>
</svg>
