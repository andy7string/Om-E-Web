<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OM_E_WEB Web Arm</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px;
            min-width: 320px;
            margin: 0;
        }
        
        h3 {
            margin: 0 0 16px 0;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        button:hover {
            background: #106ebe;
        }
        
        button.secondary {
            background: #6c757d;
        }
        
        button.secondary:hover {
            background: #5a6268;
        }
        
        button.danger {
            background: #dc3545;
        }
        
        button.danger:hover {
            background: #c82333;
        }
        
        #status {
            margin-top: 12px;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        
        .status-item {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 8px;
            text-align: center;
            font-size: 12px;
        }
        
        .status-item .label {
            font-weight: bold;
            color: #495057;
        }
        
        .status-item .value {
            color: #6c757d;
            margin-top: 4px;
        }
        
        .divider {
            border-top: 1px solid #dee2e6;
            margin: 16px 0;
        }

        /* 🐰 Orb Style Selector */
        .orb-style-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .orb-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .orb-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .orb-btn.active {
            background: #e7f1ff;
            border-color: #0078d4;
        }

        .orb-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            min-height: 40px;
        }

        .orb-icon svg {
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
        }

        .orb-label {
            font-size: 12px;
            font-weight: 500;
            color: #495057;
        }
    </style>
</head>
<body>
    <h3>OM_E_WEB Web Arm</h3>
    
    <input 
        id="wsUrl" 
        type="text" 
        placeholder="WebSocket URL"
        value="ws://127.0.0.1:17892"
    />
    
    <button id="saveBtn">Save & Reconnect</button>
    
    <div class="divider"></div>
    
    <h4>Extension Status</h4>
    <div class="status-grid">
        <div class="status-item">
            <div class="label">Connection</div>
            <div id="connectionStatus" class="value">Checking...</div>
        </div>
        <div class="status-item">
            <div class="label">Active Tabs</div>
            <div id="activeTabs" class="value">-</div>
        </div>
        <div class="status-item">
            <div class="label">Content Scripts</div>
            <div id="contentScripts" class="value">-</div>
        </div>
        <div class="status-item">
            <div class="label">Cache Status</div>
            <div id="cacheStatus" class="value">-</div>
        </div>
        <!-- 🆕 NEW: DOM Change Status -->
        <div class="status-item">
            <div class="label">DOM Changes</div>
            <div id="domChanges" class="value">-</div>
        </div>
        <div class="status-item">
            <div class="label">Recent Changes</div>
            <div id="recentChanges" class="value">-</div>
        </div>
    </div>
    
    <div class="divider"></div>
    
    <h4>Actions</h4>
    <button id="refreshBtn" class="secondary">🔄 Refresh Extension State</button>
    <button id="clearCacheBtn" class="danger">🧹 Clear All Cache</button>
    
    <!-- 🐰 ORB STYLE SELECTOR -->
    <div class="divider"></div>
    <h4>Orb Style</h4>
    <div class="orb-style-grid">
        <button id="orbKawaii" class="orb-btn" data-theme="kawaii">
            <span class="orb-icon">
                <!-- Mini Kawaii kitty SVG -->
                <svg width="36" height="44" viewBox="0 0 60 72" fill="none">
                    <defs>
                        <!-- Fluffy white body gradient -->
                        <radialGradient id="kFluffy" cx="50%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="70%" stop-color="#f8f4ff"/>
                            <stop offset="100%" stop-color="#e8e0f0"/>
                        </radialGradient>
                        <!-- Pink inner ear -->
                        <linearGradient id="kPinkEar" x1="50%" y1="0%" x2="50%" y2="100%">
                            <stop offset="0%" stop-color="#ffb6c1"/>
                            <stop offset="100%" stop-color="#ff91a4"/>
                        </linearGradient>
                        <!-- Sparkly blue eye gradient -->
                        <radialGradient id="kEyeBlue" cx="50%" cy="30%" r="50%">
                            <stop offset="0%" stop-color="#7ec8e3"/>
                            <stop offset="50%" stop-color="#4a9eca"/>
                            <stop offset="100%" stop-color="#2d7eb0"/>
                        </radialGradient>
                        <!-- Cherry gradient -->
                        <radialGradient id="kCherry" cx="30%" cy="30%" r="60%">
                            <stop offset="0%" stop-color="#ff8a9b"/>
                            <stop offset="100%" stop-color="#e05670"/>
                        </radialGradient>
                    </defs>
                    <!-- Left ear (pointed, cat-style) -->
                    <path d="M12 28 L8 8 L22 22 Z" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="1"/>
                    <path d="M13 24 L11 12 L19 21 Z" fill="url(#kPinkEar)"/>
                    <!-- Right ear -->
                    <path d="M48 28 L52 8 L38 22 Z" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="1"/>
                    <path d="M47 24 L49 12 L41 21 Z" fill="url(#kPinkEar)"/>
                    <!-- Strawberry on top -->
                    <path d="M30 2 Q28 -2 26 0 M30 2 Q32 -2 34 0" stroke="#50a060" stroke-width="1.5" fill="none"/>
                    <ellipse cx="30" cy="10" rx="8" ry="7" fill="url(#kCherry)"/>
                    <ellipse cx="27" cy="7" rx="2" ry="1.2" fill="rgba(255,255,255,0.5)"/>
                    <!-- Seeds -->
                    <ellipse cx="26" cy="11" rx="0.8" ry="0.5" fill="rgba(255,220,180,0.7)"/>
                    <ellipse cx="34" cy="10" rx="0.8" ry="0.5" fill="rgba(255,220,180,0.7)"/>
                    <!-- Fluffy head -->
                    <ellipse cx="30" cy="38" rx="24" ry="22" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="1"/>
                    <!-- Fluffy cheek tufts -->
                    <ellipse cx="8" cy="40" rx="6" ry="8" fill="url(#kFluffy)"/>
                    <ellipse cx="52" cy="40" rx="6" ry="8" fill="url(#kFluffy)"/>
                    <!-- Big sparkly eyes -->
                    <ellipse cx="20" cy="38" rx="7" ry="8" fill="url(#kEyeBlue)" stroke="#2d6090" stroke-width="0.5"/>
                    <ellipse cx="40" cy="38" rx="7" ry="8" fill="url(#kEyeBlue)" stroke="#2d6090" stroke-width="0.5"/>
                    <!-- Eye highlights (sparkles) -->
                    <circle cx="17" cy="35" r="2.5" fill="white"/>
                    <circle cx="22" cy="33" r="1.2" fill="white"/>
                    <circle cx="37" cy="35" r="2.5" fill="white"/>
                    <circle cx="42" cy="33" r="1.2" fill="white"/>
                    <!-- Pupils -->
                    <ellipse cx="21" cy="40" rx="2" ry="2.5" fill="#1a3050"/>
                    <ellipse cx="41" cy="40" rx="2" ry="2.5" fill="#1a3050"/>
                    <!-- Rosy blush -->
                    <ellipse cx="10" cy="44" rx="4" ry="2.5" fill="rgba(255,150,170,0.5)"/>
                    <ellipse cx="50" cy="44" rx="4" ry="2.5" fill="rgba(255,150,170,0.5)"/>
                    <!-- Cute nose -->
                    <ellipse cx="30" cy="46" rx="2" ry="1.5" fill="#ffb0c0"/>
                    <!-- Tiny smile -->
                    <path d="M26 50 Q30 54 34 50" stroke="#c090a0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    <!-- Little body hint -->
                    <ellipse cx="30" cy="64" rx="14" ry="8" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="1"/>
                    <!-- Tiny paws -->
                    <ellipse cx="22" cy="68" rx="4" ry="3" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="0.5"/>
                    <ellipse cx="38" cy="68" rx="4" ry="3" fill="url(#kFluffy)" stroke="#d0c0e0" stroke-width="0.5"/>
                </svg>
            </span>
            <span class="orb-label">Kawaii</span>
        </button>
        <button id="orbRobot" class="orb-btn" data-theme="robot">
            <span class="orb-icon">
                <!-- Mini Robot SVG -->
                <svg width="32" height="36" viewBox="0 14 60 72" fill="none">
                    <defs>
                        <linearGradient id="rBodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                            <stop offset="0%" stop-color="rgba(147,112,219,0.5)"/>
                            <stop offset="50%" stop-color="rgba(80,100,200,0.4)"/>
                            <stop offset="100%" stop-color="rgba(66,133,244,0.35)"/>
                        </linearGradient>
                        <linearGradient id="rGoggleGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                            <stop offset="0%" stop-color="rgba(186,147,255,0.6)"/>
                            <stop offset="100%" stop-color="rgba(147,112,219,0.5)"/>
                        </linearGradient>
                        <radialGradient id="rGlowEye" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#00ffff"/>
                            <stop offset="100%" stop-color="#00e5ff"/>
                        </radialGradient>
                    </defs>
                    <!-- Ear muffs -->
                    <ellipse cx="6" cy="54" rx="5" ry="7" fill="rgba(66,133,244,0.35)" stroke="rgba(66,133,244,0.6)" stroke-width="1.5"/>
                    <ellipse cx="54" cy="54" rx="5" ry="7" fill="rgba(66,133,244,0.35)" stroke="rgba(66,133,244,0.6)" stroke-width="1.5"/>
                    <!-- Dome head -->
                    <path d="M8 58 Q8 32 30 28 Q52 32 52 58 Q52 64 30 66 Q8 64 8 58 Z" fill="url(#rBodyGrad)" stroke="rgba(66,133,244,0.6)" stroke-width="1.5"/>
                    <!-- Goggles -->
                    <ellipse cx="20" cy="34" rx="9" ry="7" fill="url(#rGoggleGrad)" stroke="rgba(147,112,219,0.8)" stroke-width="1.5"/>
                    <ellipse cx="40" cy="34" rx="9" ry="7" fill="url(#rGoggleGrad)" stroke="rgba(147,112,219,0.8)" stroke-width="1.5"/>
                    <ellipse cx="20" cy="34" rx="6" ry="5" fill="rgba(40,40,80,0.7)"/>
                    <ellipse cx="40" cy="34" rx="6" ry="5" fill="rgba(40,40,80,0.7)"/>
                    <rect x="28" y="32" width="4" height="4" rx="1" fill="rgba(147,112,219,0.6)"/>
                    <!-- Face plate -->
                    <rect x="14" y="46" rx="6" ry="6" width="32" height="16" fill="rgba(30,50,90,0.5)" stroke="rgba(66,133,244,0.5)" stroke-width="1"/>
                    <!-- Glowing eyes -->
                    <ellipse cx="23" cy="54" rx="3" ry="5" fill="url(#rGlowEye)"/>
                    <ellipse cx="37" cy="54" rx="3" ry="5" fill="url(#rGlowEye)"/>
                    <ellipse cx="23" cy="54" rx="4" ry="6" fill="none" stroke="rgba(0,229,255,0.3)" stroke-width="2"/>
                    <ellipse cx="37" cy="54" rx="4" ry="6" fill="none" stroke="rgba(0,229,255,0.3)" stroke-width="2"/>
                </svg>
            </span>
            <span class="orb-label">Robot</span>
        </button>
    </div>

    <!-- 🆕 NEW: DOM Change Controls -->
    <div class="divider"></div>
    <h4>DOM Change Detection</h4>
    <button id="enableDOMBtn" class="secondary">👁️ Enable Detection</button>
    <button id="disableDOMBtn" class="secondary">🙈 Disable Detection</button>
    <button id="resetDOMBtn" class="secondary">🔄 Reset Count</button>

    <div id="status"></div>
    
    <script src="popup.js"></script>
</body>
</html>
